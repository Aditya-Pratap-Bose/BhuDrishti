<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BhuDrishti AI — Cadastral Portal Sign In</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          base: '#F8FAFC',
          surface: '#FFFFFF',
          surface2: '#F1F5F9',
          surface3: '#E2E8F0',
          line: '#E2E8F0',
          line2: '#CBD5E1',
          scan: '#10B981',
          scanDark: '#059669',
          ink: '#0F172A',
          faint: '#64748B',
          amber: '#F59E0B',
          cyan: '#06B6D4',
        },
        fontFamily: {
          body: ['"Inter"', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'monospace'],
        },
      }
    }
  }
</script>
<link rel="stylesheet" href="./css/style.css" />
</head>

<body class="bg-base text-ink font-body antialiased min-h-screen flex items-center justify-center selection:bg-scan/20">
  <div id="authScreen" class="w-full flex items-center justify-center p-4 z-10 relative">
    <!-- Subtle Modern Light Dot Background -->
    <div class="absolute inset-0 opacity-[0.4] pointer-events-none" style="background-image: radial-gradient(#94a3b8 1px, transparent 1px); background-size: 24px 24px;"></div>

    <div class="relative w-full max-w-[380px] z-10">
      <div class="text-center mb-6">
        <!-- Modern Geometric Logo -->
        <div class="w-12 h-12 mx-auto mb-3 rounded-2xl flex items-center justify-center bg-gradient-to-br from-emerald-500 to-teal-600 text-white shadow-[0_10px_25px_rgba(16,185,129,0.35)]">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-ink tracking-tight">BhuDrishti AI</h1>
        <p class="text-faint text-xs mt-1 font-medium">Autonomous Cadastral Boundary Intelligence</p>
      </div>

      <div class="glass-panel rounded-3xl p-6 shadow-2xl fade-in">
        <div class="flex gap-2 mb-5 p-1 rounded-xl bg-surface2 border border-line">
          <button id="tabLogin" onclick="switchAuthTab('login')" class="flex-1 py-2 rounded-lg text-xs font-semibold transition bg-gradient-to-r from-emerald-500 to-teal-600 text-white shadow-sm">Sign In</button>
          <button id="tabRegister" onclick="switchAuthTab('register')" class="flex-1 py-2 rounded-lg text-xs font-medium transition text-faint hover:text-ink">Register</button>
        </div>

        <div id="authError" class="hidden mb-4 text-xs rounded-xl border border-red-200 bg-red-50 text-red-700 px-3.5 py-2.5"></div>

        <form id="loginForm" class="space-y-3.5" onsubmit="handleLogin(event)">
          <div>
            <label class="block text-[10px] text-faint mb-1.5 font-mono uppercase tracking-wider font-semibold">Officer Email</label>
            <input required type="email" id="loginEmail" class="w-full glass-input rounded-xl px-3.5 py-2.5 text-xs text-ink placeholder-slate-400 outline-none" placeholder="officer@revenue.gov.in" />
          </div>
          <div>
            <label class="block text-[10px] text-faint mb-1.5 font-mono uppercase tracking-wider font-semibold">Password</label>
            <input required type="password" id="loginPassword" class="w-full glass-input rounded-xl px-3.5 py-2.5 text-xs text-ink placeholder-slate-400 outline-none" placeholder="••••••••" />
          </div>
          <button type="submit" id="loginSubmitBtn" class="w-full mt-2 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold text-xs py-3 rounded-xl transition shadow-[0_4px_20px_rgba(16,185,129,0.3)]">Sign In to Hub</button>
        </form>

        <form id="registerForm" class="space-y-3.5 hidden" onsubmit="handleRegister(event)">
          <div>
            <label class="block text-[10px] text-faint mb-1.5 font-mono uppercase tracking-wider font-semibold">Full Name</label>
            <input required id="regName" class="w-full glass-input rounded-xl px-3.5 py-2.5 text-xs text-ink placeholder-slate-400 outline-none" placeholder="Aditya Sharma" />
          </div>
          <div>
            <label class="block text-[10px] text-faint mb-1.5 font-mono uppercase tracking-wider font-semibold">Officer Email</label>
            <input required type="email" id="regEmail" class="w-full glass-input rounded-xl px-3.5 py-2.5 text-xs text-ink placeholder-slate-400 outline-none" placeholder="officer@revenue.gov.in" />
          </div>
          <div>
            <label class="block text-[10px] text-faint mb-1.5 font-mono uppercase tracking-wider font-semibold">Password</label>
            <input required type="password" minlength="8" id="regPassword" class="w-full glass-input rounded-xl px-3.5 py-2.5 text-xs text-ink placeholder-slate-400 outline-none" placeholder="At least 8 characters" />
          </div>
          <div>
            <label class="block text-[10px] text-faint mb-1.5 font-mono uppercase tracking-wider font-semibold">Role Designation</label>
            <select id="regRole" class="w-full glass-input rounded-xl px-3.5 py-2.5 text-xs text-ink outline-none">
              <option value="surveyor" selected>Cadastral Surveyor</option>
            </select>
          </div>
          <button type="submit" id="registerSubmitBtn" class="w-full mt-2 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold text-xs py-3 rounded-xl transition shadow-[0_4px_20px_rgba(16,185,129,0.3)]">Create Surveyor Account</button>
        </form>
      </div>

      <!-- Backend endpoint is configured per deployment, not by end users. -->
      <div class="hidden" aria-hidden="true">
        <button onclick="toggleApiSettings()" class="text-[11px] text-faint hover:text-ink inline-flex items-center gap-1.5 transition">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          <span>API Connection Settings</span>
        </button>
        <div id="apiSettingsBox" class="hidden mt-3 glass-panel rounded-2xl p-3 text-left">
          <label class="block text-[10px] text-faint mb-1.5 font-mono uppercase tracking-wider font-semibold">Backend Base URL</label>
          <div class="flex gap-2">
            <input id="apiBaseUrlInput" class="flex-1 glass-input rounded-xl px-2.5 py-1.5 text-xs font-mono text-ink outline-none" />
            <button onclick="saveApiBaseUrl()" class="text-xs bg-scanDark text-white font-bold px-3.5 py-1.5 rounded-xl transition shadow-sm">Save</button>
          </div>
        </div>
      </div>
    </div>
  </div>

<script src="./js/api.js"></script>
<script src="./js/auth.js"></script>
</body>
</html>
